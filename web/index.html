<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f4f6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kinesis</title>
    <link rel="stylesheet" href="/src/lab.css" />
    <style>
      :root {
        --bg: #f1f4f6;
        --panel: #ffffff;
        --surface: #f7f9fa;
        --line: #d0d8df;
        --control-line: #7c8d9b;
        --text: #253340;
        --muted: #526372;
        --accent: #235f8c;
        --accent-soft: #e6eef5;
        --on-accent: #ffffff;
        --error: #a33f24;
        --rack: #607482;
        --cut-ground: #eef1f3;
        --cut-column: #8996a1;
        --cut-station: #526372;
        --cut-blocked: #c5cdd4;
        /* Trois séries, distinguées aussi par leur forme ; contraste vérifié sur fond blanc. */
        --btn: #eaf0f4;
        --plan-ground: #e3e9ee;
        --radius: 16px;
        --radius-s: 10px;
        --shadow: 0 1px 2px rgb(37 51 64 / .06), 0 6px 20px rgb(37 51 64 / .08);
        --series-0: #3987e5; --series-1: #d95926; --series-2: #199e70;
        font: 13px/1.4 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        color-scheme: light;
      }
      html, body, #root { margin: 0; height: 100%; background: var(--bg); }
      .panel {
        position: fixed; left: 16px; bottom: 16px;
        display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
        max-width: calc(100% - 50px);
        padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
      }
      .seg { display: flex; }
      .control-group { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
      .control-group + .control-group { padding-left: 12px; border-left: 1px solid var(--line); }
      #open-editor { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
      button, select, input {
        font: inherit; color: var(--text); background: transparent;
        border: 1px solid var(--control-line); border-radius: var(--radius-s); padding: 4px 12px; cursor: pointer;
        min-height: 44px; min-width: 44px; touch-action: manipulation;
      }
      select, input { background: var(--panel); accent-color: var(--accent); }
      input { box-sizing: border-box; width: 100%; min-width: 0; cursor: text; }
      .seg { background: var(--btn); border-radius: 999px; padding: 3px; gap: 2px; }
      .seg button { border-color: transparent; border-radius: 999px; }
      button { background: var(--btn); border-color: transparent; transition: background-color .15s, border-color .15s; }
      button:hover, select:hover { border-color: var(--accent); background: var(--accent-soft); }
      button:active { background: var(--accent-soft); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      button[aria-pressed='true'] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
      button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .meta { color: var(--muted); padding-right: 4px; }
      summary { cursor: pointer; min-height: 44px; display: list-item; line-height: 44px; }
      summary:hover { color: var(--text); }
      details p { margin: 4px 0; }
      .editor { position: fixed; z-index: 2; left: 16px; top: 16px; width: min(980px, calc(100% - 34px));
        max-height: calc(100dvh - 34px); display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
      .editor header, .editor footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; }
      .editor header { border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--surface); }
      .editor footer { border-top: 1px solid var(--line); flex-shrink: 0; background: var(--surface); }
      h1, h2 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
      .editor p { margin: 4px 0; color: var(--muted); }
      fieldset { margin: 8px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
      legend { padding: 0 4px; font-weight: 600; }
      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
      .field-grid label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
      .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      .coordinates { display: flex; align-items: end; gap: 8px; margin-top: 12px; }
      .coordinates label { width: 70px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      .legend { font-size: 12px; }
      .regular-settings { border-top: 1px solid var(--line); padding-top: 4px; }
      .regular-settings .field-grid { margin-top: 12px; }
      .editor .error, .error { color: var(--error); }
      .primary { color: var(--on-accent); background: var(--accent); border-color: var(--accent); white-space: nowrap; }
      .primary:hover { color: var(--accent); }
      .congestion { position: fixed; right: 16px; top: 16px; width: 280px; max-height: calc(100dvh - 120px); overflow: auto;
        padding: 0 12px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
      .congestion p { margin: 6px 0; }
      .congestion h2 { font-size: 13px; margin: 10px 0 6px; }
      .cut { display: block; width: 100%; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 8px; cursor: crosshair; }
      .scale { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
      .ramp { flex: 1; height: 10px; border-radius: 2px; }
      .campaign-body { padding: 16px; overflow: auto; overscroll-behavior: contain; min-height: 0; }
      .exploration-chart .front-point { fill: var(--accent); stroke: var(--accent); }
      .exploration-chart .dominated-point { fill: var(--muted); stroke: var(--muted); }
      .exploration-chart text { stroke: none; }
      .campaign-fields { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .campaign-fields small { color: var(--muted); font-size: 12px; }
      .chart { display: block; width: 100%; max-width: 460px; margin: 8px 0; font-size: 13px; }
      .chart text { fill: var(--muted); }
      .chart .grid { stroke: var(--line); stroke-width: 1; }
      .s0 { --series: var(--series-0); } .s1 { --series: var(--series-1); } .s2 { --series: var(--series-2); }
      .chart .series { fill: none; stroke: var(--series); stroke-width: 2; }
      .chart .point line { stroke: var(--series); stroke-width: 1.5; }
      .chart .point :is(circle, rect:not([fill]), polygon), .legend-list svg * { fill: var(--series); stroke: var(--bg); stroke-width: 1.5; }
      .chart .point:hover :is(circle, polygon) { stroke: var(--text); }
      .legend-list { display: flex; flex-wrap: wrap; gap: 16px; list-style: none; padding: 0; margin: 8px 0 0; }
      .legend-list li { display: flex; align-items: center; gap: 6px; }
      .plans { list-style: none; padding: 0; margin: 0; }
      .plans li { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 44px; }
      .plans label, .choice { display: flex; align-items: center; gap: 8px; min-height: 44px; }
      .plans input, .choice input { width: 20px; min-width: 20px; min-height: 20px; margin: 0; }
      .campaign-body fieldset { margin: 0 0 12px; }
      .save-plan label { width: min(240px, 100%); }
      .table-scroll { overflow-x: auto; }
      .table-scroll th, .table-scroll td { white-space: nowrap; }
      table { border-collapse: collapse; margin-top: 8px; }
      th, td { padding: 6px 12px; text-align: right; border-bottom: 1px solid var(--line); }
      thead th { color: var(--muted); font-weight: 400; }
      progress { vertical-align: middle; accent-color: var(--accent); }
      @media (max-width: 700px) {
        .control-group + .control-group { padding-left: 0; border-left: 0; }
        .campaign-fields { grid-template-columns: 1fr 1fr; }
        .congestion { left: 16px; right: auto; width: calc(100% - 58px); max-height: 45dvh; }
        .editor footer { flex-direction: column; align-items: stretch; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
